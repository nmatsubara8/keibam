# 運用設定（src.operation.OperationConfig が読み込む）
# operation_mode: advisory | semi_auto | full_auto
#   advisory  : 推奨表示のみ。実行は人間（履歴記録のみ）= 当面の既定
#   semi_auto : 購入リストを出力（発注は人間）
#   full_auto : 自動発注（規約・法的リスクのため既定無効。enable_auto を別途要求）
operation_mode: advisory

# 資金・リスク
bankroll: 100000.0
kelly_fraction_ratio: 0.25  # フラクショナル・ケリー係数（0<r<=1）。払戻はパリミュチュエルで
                            #   確定オッズどおり（正しい）だが、選定時は暫定オッズ近似のため実戦で
                            #   緩やかに目減りしうる。未実証のため保守的な1/4ケリー（前向き検証後に引き上げ可）
per_bet_cap_ratio: 0.05     # 1馬券あたり上限（bankroll比）
max_daily_ratio: 1.0        # 1日総投資上限（bankroll比）

# 検証済み単勝戦略（kelly_backtest.py / validate_edge.py）
#   単勝・EV>1.1・オッズ≤15倍。プラセボ＆リーク監査を通過し、2022–2026 の全年度で
#   フラット回収率1.9–2.1（確定オッズ基準）。エッジは3–15倍に集中し、15倍超は -EV。
max_odds: 15.0              # これ超のオッズ（人気薄）は買わない
tansho_ev_threshold: 1.1   # 単勝EV下限（既定 BetThresholds の1.78を上書き）

# EV 較正（calibrate-ev の 補正Harville/r̂較正/市場合成）をライブ選定に適用する。
#   OOS 検証（fit=2024/eval=2025）で無較正の大穴垂れ流しが解消し全体回収率 27%→76% に改善。
#   models/{place_exponents,win_calibrator,blend_weights}.json を使用（無ければ自動で従来挙動）。
#   必ず OOS で fit したものを使うこと（学習年で fit すると退化。Benter §5）。false で無効化。
use_ev_calibration: true

# 安全装置（損失ストップ / kill switch）
kill_switch_enabled: true   # 当日実現損失が上限超で推奨/記録を停止する
max_daily_loss_ratio: 0.3   # 当日実現損失が bankroll*0.3 を超えたら停止
initial_bankroll: 100000.0  # 実効 bankroll の基準（= initial + 累積純損益）
