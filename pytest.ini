[pytest]

# テストを見つけるためのディレクトリ
testpaths = tests

# リポジトリルートを sys.path に載せる（`import src.*` を可能にする）。
# これが無いと素の `pytest`（= python -m pytest でない起動）で
# ModuleNotFoundError: No module named 'src' になる。pytest>=7 の pythonpath 機能。
pythonpath = .

# srcディレクトリをパッケージとして扱う
# これにより、src内のモジュールが他のモジュールから正しくインポートされます。
python_functions = test_*

#addopts = --cov=src --cov-report=term-missing
