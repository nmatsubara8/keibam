[tool.ruff]
line-length = 120
indent-width = 4
exclude = ["**/*.ipynb"]
#target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
    "G004", # `logging-f-string` : loggingでf-stringを使いたいので無視する
    "PD002", #すでにpandasで`inplace=True`はいろんなところで使っているため
    "RUF001", # 全角記号など`ambiguous unicode character`も使いたいため
    "RUF002",# 全角記号など`ambiguous unicode character`も使いたいため
    "RUF003",# 全角記号など`ambiguous unicode character`も使いたいため
    "PLC1901", # compare-to-empty-string : `if a == "`のように空文字列で直接比較したいときがあるため
    "PLR2004", # magic-value-comparison: listのサイズで判定するときがよくあるため
    "ANN002", # missing-type-args
    "ANN003", # missing-type-kwargs
    "ERA", # : 役立つこともあるが、コメントアウトしていないコードも警告されるので無視する

    # いずれ無視しないようにする
    "ANN201", # missing-return-type-public-function:
    "ANN202", # missing-return-type-private-function:
    "PLR",  # pylint Refactor

    # 以下のルールはannofabcliのコードに合っていないので無効化した
    "RSE", # flake8-raise
    "D", # pydocstyle, Docstringを中途半端にしか書いていないので、除外する
    "C90", # mccabe
    "T20", # flake8-print
    "SLF", #  flake8-self
    "BLE", # flake8-blind-except
    "FBT", # flake8-boolean-trap
    "TRY", # tryceratops
    "COM", # flake8-commas
    "S", # flake8-bandit
    "EM",#flake8-errmsg
    "EXE", # flake8-executable
    "ICN", # flake8-import-conventions
    "RET",#flake8-return
    "SIM",#flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", #pathlibを使わないコードが多いので、除外する
    "ISC", #flake8-implicit-str-concat
    "N", # pep8-naming
    "PT", # flake8-pytest-style
]

fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# Streamlit アプリは sys.path ブートストラップ／set_page_config を import より前に
# 置く必要があるため、E402（import が先頭にない）を許容する。
"app/Home.py" = ["E402"]
"app/pages/*.py" = ["E402"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


[tool.pytest.ini.options]
testpaths="tests"
addopts = [
    "--import-mode=importlib",
]
PYTHONPATH="./"

# 型チェック（境界の契約を型で固定する）。段階導入のため対象を新規モジュールから広げる。
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_redundant_casts = true
explicit_package_bases = true
namespace_packages = true
mypy_path = "."
files = [
    "src/policies",
    "src/preprocessing",
    "src/portfolio",
    "src/operation",
    "src/simulation/_metrics.py",
    "src/simulation/_plot.py",
    "src/simulation/_popularity_baseline.py",
    "src/training/_sample_weights.py",
    "src/constants/_odds_phases.py",
    "src/constants/_logging_config.py",
    "src/constants/_units.py",
    "src/preparing/_scraper.py",
    "src/preparing/_rate_limiter.py",
    "src/preparing/_odds_snapshot.py",
    "src/preparing/odds_scheduler.py",
    "src/pipeline/_ingestion.py",
    "src/pipeline/_retrain.py",
    "src/storage",
    "app/_betting_history.py",
    "app/_formatters.py",
    "app/_prediction_service.py",
    "app/_model_eval.py",
    "app/_tuning_job.py",
]
